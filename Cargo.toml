[package]
name = "texas"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
eframe = "0.33.0"
egui = "0.33.0"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.52.3", features = ["full"] }
libp2p = { version = "0.56.0", features = [
    "tokio",
    "tcp",
    "noise",
    "yamux",
    "gossipsub",
    "ping",
    "mdns",
    "macros",
] }
